version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aptus-ai-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/config/.env
    networks:
      - aptus-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aptus-ai-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aptus-net

networks:
  aptus-net:
    driver: bridge
